<!DOCTYPE html>
<html>
<head>
    <title>Nouveautés cinéma</title>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1c1c1c;
            border-radius: 10px;
            padding: 10px;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1> Nouveautés cinéma</h1>

<div class="grid">
    {% for film in films %}
    <div class="card">
        <img src="{{ film.poster }}">

        <h3>{{ film.title }}</h3>

        <p> Acteurs : {{ film.actors }}</p>
        <p> Réalisateurs : {{ film.directors }}</p>
        <p> {{ film.year }}</p>
    </div>
    {% endfor %}
</div>

</body>
</html>
