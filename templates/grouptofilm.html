<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Group to Film - Recommandation en groupe</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Bebas Neue', sans-serif;
            color: #ffcc00;
            height: 100%;
            overflow-x: hidden;
        }

        /* LOGO */
        .cineclik-logo {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 28px;
            color: #fff;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 15px;
            border-radius: 10px;
            z-index: 10;
        }

        /* VIDEO */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(1.2);
        }

        /* CONTENT FULL WIDTH */
        .content {
            position: relative;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
        }

        /* FORM CENTRÉ */
        .form-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            text-align: left;
        }

        select {
            width: 100%;
        }

        /* SELECT2 */
        .select2-container {
            width: 100% !important;
        }

        .select2-container--default .select2-selection--multiple {
            background-color: #e0e0e0 !important;
            border-radius: 6px;
            padding: 6px;
        }

        /* BUTTON */
        .search-button {
            background-color: #ffcc00;
            color: #000;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 25px;
            cursor: pointer;
            border: none;
        }

        /* TITRE */
        .suggestion-title {
            text-align: center;
            font-size: 2.2rem;
            margin: 40px 0 20px;
        }

        /* FULL WIDTH GRID */
        .film-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 par ligne */
            gap: 25px;
            width: 100%;
        }

        /* CARD */
        .film-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .film-card:hover {
            transform: scale(1.05);
            background: rgba(255, 204, 0, 0.8);
            color: black;
        }

        .film-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .film-row { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .film-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

<a href="/" class="cineclik-logo">CineClik</a>

<video class="bg-video" autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='fond.mp4') }}" type="video/mp4" />
</video>

<div class="content">

    <!-- FORM FULL WIDTH -->
    <div class="form-container">
        <h1>Recommandation en groupe</h1>

        <form method="POST">

            <label>Genres</label>
            <select name="genres" id="genres" multiple>
                {% for genre in genres_list %}
                <option value="{{ genre }}">{{ genre }}</option>
                {% endfor %}
            </select>

            <label>Acteurs</label>
            <select name="actors" id="actors" multiple>
                {% for actor in actors_list %}
                <option value="{{ actor }}">{{ actor }}</option>
                {% endfor %}
            </select>

            <label>Réalisateurs</label>
            <select name="directors" id="directors" multiple>
                {% for director in directors_list %}
                <option value="{{ director }}">{{ director }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="search-button">Rechercher</button>
        </form>
    </div>

    <!-- RESULTS FULL WIDTH -->
    <h1 class="suggestion-title">Suggestions</h1>

    {% if suggestions %}
    <div class="film-row">
        {% for film in suggestions %}
        <a href="{{ url_for('film_infos', tconst=film.tconst) }}" class="film-card">
            <img src="https://image.tmdb.org/t/p/w200/{{ film.poster }}" alt="{{ film.title }}">
            <p>{{ film.title }}</p>
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p style="text-align:center;">Aucune suggestion pour le moment.</p>
    {% endif %}

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function () {
    $('#genres').select2();
    $('#actors').select2();
    $('#directors').select2();
});
</script>

</body>
</html>
