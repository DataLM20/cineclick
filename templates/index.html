<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Cineclik</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='style_ftf.css') }}">

<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Bebas Neue', sans-serif;
    overflow: hidden;
  }

  .bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1;
    background: black;
  }

  #menu-toggle {
    display: none;
  }

  .menu-button {
    position: fixed;
    top: 20px;
    right: 30px;
    font-size: 2.5rem;
    cursor: pointer;
    z-index: 1001;
    background: transparent;
    border: none;
    color: black;
    user-select: none;
  }

  .side-menu {
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    height: 100vh;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: -2px 0 8px rgba(0,0,0,0.1);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    padding: 60px 25px 20px 25px;
    box-sizing: border-box;
    z-index: 1000;
  }

  #menu-toggle:checked + .menu-button + .side-menu {
    transform: translateX(0);
  }

  .side-menu a {
    display: block;
    padding: 15px 0;
    text-decoration: none;
    color: #111;
    font-size: 1.3rem;
    border-bottom: 1px solid #ddd;
  }

  .side-menu a:hover {
    color: #ffcc00;
  }

  .title {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    color: #ffcc00;
    font-size: 70px;
    text-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  .subtitle {
    position: absolute;
    top: 52%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 28px;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  
.home-btn{
    position:fixed;
    top:20px;
    left:30px;
    z-index:1001;

    padding:12px 20px;

    background:rgba(0,0,0,0.7);
    color:white;

    text-decoration:none;
    border-radius:12px;

    font-size:16px;
    transition:0.3s;
}

.home-btn:hover{
    background:#ffcc00;
    color:black;
}
</style>
</head>

<body>

  <!-- 🎬 VIDEO BACKGROUND -->
  <video autoplay muted loop class="bg-video">
    <source src="{{ url_for('static', filename='cine.mp4') }}" type="video/mp4" />
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <!-- ☰ MENU -->
  <input type="checkbox" id="menu-toggle" />
  <label for="menu-toggle" class="menu-button">☰ MENU</label>

  <nav class="side-menu">
    <a href="{{ url_for('recherche') }}"> Rechercher un film</a>
    <a href="{{ url_for('filmtofilm') }}"> Recommandation par film</a>
    <a href="{{ url_for('moodtofilm') }}"> Recommandation par humeur</a>
    <a href="{{ url_for('grouptofilm') }}"> Recommandation en groupe</a>
    <a href="{{ url_for('geocodcine') }}"> Trouver un film au cinema</a>
    <a href="{{ url_for('chat') }}"> Parler à l’assistant</a>
  </nav>

<a href="https://datanovation.fr/" class="home-btn">
    ← Retour au site
</a>

</body>
</html>
